name: Recover archived provider-cross-posting source

on:
  push:
    branches:
      - agent/provider-cross-posting
    paths:
      - .github/workflows/recover-provider-cross-posting.yml

permissions:
  contents: write

concurrency:
  group: recover-provider-cross-posting-evento-globolo.github.io
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'evento-globolo/evento-globolo.github.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/provider-cross-posting
          fetch-depth: 0
          persist-credentials: true

      - name: Restore credential-clean archived source
        shell: bash
        env:
          PAYLOAD_B64: ''
          EXPECTED_SHA256: 'e46093494d55189ce9a14c42dde4bf266aef5723cb8aec2267eda6ac0f730712'
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          printf '%s' "$PAYLOAD_B64" | base64 --decode > "$tmp"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$tmp" | sha256sum --check --status
          tar -xzf "$tmp"
          rm -f "$tmp" .github/workflows/recover-provider-cross-posting.yml
          git diff --check
          if grep -RIE --exclude-dir=.git \
            '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|cfat_[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}|sk-(proj-)?[A-Za-z0-9_-]{20,})' .; then
            echo 'credential-like material found; refusing to publish' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover Astro marketing site and Pages deployment' \
            -m 'Recovered from the credential-clean 55-day ChatGPT work-reconciliation corpus; dancing-dragons excluded.'
          git push origin HEAD:agent/provider-cross-posting
